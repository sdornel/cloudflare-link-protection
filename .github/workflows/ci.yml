name: Public demo checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: npm run build
      - run: npm run example:refresh && git diff --exit-code -- example.html
      - run: npm run check:public
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm run check:workers
        env:
          WRANGLER_SEND_METRICS: "false"
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:browser
      - run: npm run screenshots
      - run: npm run check:performance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neutral-browser-evidence
          path: |
            test-results/
            docs/images/*.png
            browser-output/performance.json
